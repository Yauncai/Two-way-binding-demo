<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Way Binding Demo</title>
    <script src="https://unpkg.com/vue"></script>
</head>
<body>

    <div id="app">
        <h1>SnoozeBerry Message Tester</h1>

        <label for="message">Type your snooze message:</label>
        <input type="text" id="message" v-model="snoozeMessage" placeholder="e.g. I believe in you">
        
        <h2>Live Preview</h2>
        <p>The alarm will say: <strong>{{ snoozeMessage }}</strong></p>

        <p v-if="snoozeMessage.length > 20">
        That message is quite long. The alarm might fall asleep reading it.
        </p>

        <button @click="snoozeMessage = 'I believe in you'">
        Reset to Default Message
        </button>

    </div>

    <script>
        const { createApp, ref } = Vue

        createApp({
            setup() {
                const snoozeMessage = ref('')
                return {
                    snoozeMessage
                }
            }
        }).mount('#app')
    </script>
    
</body>
</html>
